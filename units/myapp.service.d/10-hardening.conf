# Drop-in с песочницей для myapp.service.
# Установка:
#   sudo mkdir -p /etc/systemd/system/myapp.service.d
#   sudo cp 10-hardening.conf /etc/systemd/system/myapp.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart myapp
# Оценка защищённости юнита:  systemd-analyze security myapp.service
[Service]
NoNewPrivileges=true
PrivateTmp=true
ProtectSystem=strict
ProtectHome=true
ProtectKernelTunables=true
ProtectControlGroups=true
# При ProtectSystem=strict файловая система доступна только для чтения —
# явно разрешаем запись туда, где приложению она нужна:
ReadWritePaths=/opt/myapp /var/log/myapp
